name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/immich-provider-release.jks"
      - name: Test and build signed APK
        env:
          IMMICH_PROVIDER_KEYSTORE: ${{ runner.temp }}/immich-provider-release.jks
          IMMICH_PROVIDER_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          IMMICH_PROVIDER_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          IMMICH_PROVIDER_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease
      - name: Prepare release asset
        run: cp app/build/outputs/apk/release/app-release.apk immich-provider.apk
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" immich-provider.apk --generate-notes --title "Immich Provider $GITHUB_REF_NAME"
